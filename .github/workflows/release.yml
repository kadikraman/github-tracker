name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # node is needed by the Podfile's autolinking and the Xcode JS-bundle phase
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install pods
        run: RCT_NEW_ARCH_ENABLED=1 pod install
        working-directory: macos

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build (Release, Developer ID, hardened runtime)
        working-directory: macos
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild -workspace GitHubTracker.xcworkspace \
            -scheme GitHubTracker-macOS \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=XQAX5LF48P \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Notarize and staple
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          APP="macos/build/Build/Products/Release/GitHubTracker.app"
          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPSTORE_PRIVATE_KEY" > "$KEY_FILE"

          ditto -c -k --keepParent "$APP" notarize.zip
          if ! xcrun notarytool submit notarize.zip \
            --key "$KEY_FILE" \
            --key-id "$APPSTORE_KEY_ID" \
            --issuer "$APPSTORE_ISSUER_ID" \
            --wait \
            --output-format json | tee notarize-result.json; then
            echo "::error::notarytool submit failed (see message above — 401 means bad API key credentials)"
            exit 1
          fi
          STATUS=$(python3 -c "import json; print(json.load(open('notarize-result.json'))['status'])")
          if [ "$STATUS" != "Accepted" ]; then
            SUBMISSION_ID=$(python3 -c "import json; print(json.load(open('notarize-result.json'))['id'])")
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_FILE" --key-id "$APPSTORE_KEY_ID" --issuer "$APPSTORE_ISSUER_ID"
            exit 1
          fi

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent "$APP" "GitHubTracker-$VERSION.zip"
          rm "$KEY_FILE" notarize.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "GitHubTracker-$VERSION.zip" \
            --title "GitHub Tracker $VERSION" \
            --generate-notes
