name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # Spark's tooling needs Node 24.19 or later; bun manages dependencies.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # desktop.config.json is the source of the app version. The tag sets the
      # user-visible version; the run number is the build number Sparkle
      # orders updates by, so it must keep increasing.
      - name: Set version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" --arg b "$GITHUB_RUN_NUMBER" \
            '.version = $v | .macos.buildNumber = $b | .expo.version = $v | .expo.macos.version = $v | .expo.macos.buildNumber = $b' \
            desktop.config.json > desktop.config.json.tmp
          mv desktop.config.json.tmp desktop.config.json

      # One temporary keychain holds the Developer ID identity and the
      # notarytool profile; spark package reads both from it.
      - name: Prepare signing keychain
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPSTORE_PRIVATE_KEY" > "$KEY_FILE"
          xcrun notarytool store-credentials github-tracker-notary \
            --key "$KEY_FILE" --key-id "$APPSTORE_KEY_ID" --issuer "$APPSTORE_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm "$KEY_FILE"
          echo "SPARK_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # spark package signs the update feed with the Sparkle key stored in the
      # Keychain under spark.<projectId>. Sparkle's generate_keys imports it.
      - name: Import Sparkle update key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # Same checksum-pinned tools spark package downloads, at the path it reuses.
          TOOLS=~/.spark/tools/sparkle-2.9.6
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz
          echo "52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c
          mkdir -p "$TOOLS"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$TOOLS"

          PROJECT_ID="$(jq -r .projectId desktop.config.json)"
          KEY_FILE="$RUNNER_TEMP/sparkle.key"
          echo -n "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"
          "$TOOLS/bin/generate_keys" --account "spark.$PROJECT_ID" -f "$KEY_FILE"
          rm "$KEY_FILE"
          PUBLIC_KEY="$("$TOOLS/bin/generate_keys" --account "spark.$PROJECT_ID" -p)"
          if [ "$PUBLIC_KEY" != "$(jq -r .updates.publicKey desktop.config.json)" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY does not match updates.publicKey in desktop.config.json"
            exit 1
          fi

      # Builds the release app, signs it with Developer ID, notarizes, staples
      # and verifies it, then signs the update archive and appcast into
      # dist/updates. It exits 2 while Apple is still processing; rerunning
      # resumes the same submission.
      - name: Build, sign and notarize
        env:
          SPARK_DEVELOPER_ID_APPLICATION: 'Developer ID Application: Kadi Kraman (XQAX5LF48P)'
          SPARK_TEAM_ID: XQAX5LF48P
          SPARK_NOTARY_KEYCHAIN_PROFILE: github-tracker-notary
        run: |
          for attempt in $(seq 1 15); do
            status=0
            npx --no-install spark package < /dev/null || status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            echo "Notarization still in progress; retrying in 60s (attempt $attempt)"
            sleep 60
          done
          echo "::error::Notarization did not finish in time"
          exit 1

      # Installed apps read the feed at releases/latest/download/appcast.xml,
      # and the appcast points at the archive next to it in the same release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/updates/*.zip dist/updates/appcast.xml \
            --title "GitHub Tracker $VERSION" \
            --generate-notes
